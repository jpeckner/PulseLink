# detekt rules for the hand-written Kotlin in the Android app: the native
# part of CLAUDE.md's "No assertions" rule. tool/lint_native.sh runs them
# (through Gradle's detektMain task), and tool/check_native_lints.sh proves
# each still reports.
#
# app/build.gradle.kts sets buildUponDefaultConfig = false, so only the
# rules turned on here run, and detekt's style rules don't creep in unasked.
# When adding a rule, add a violation for it to tool/check_native_lints.sh.

config:
  # Fails on a misspelled rule or option, rather than ignoring it.
  validation: true

# Print only findings. tool/lint_native.sh reads the file counts from the
# reports detekt writes instead.
console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'IssuesReport'
    - 'FileBasedIssuesReport'

potential-bugs:
  active: true
  # `!!`
  UnsafeCallOnNullableType:
    active: true
  # `lateinit`
  LateinitUsage:
    active: true
  # `else` in a `when` over a sealed class or enum.
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  # A cast that can never succeed. Other unchecked `as` casts are caught by
  # tool/lint_native.sh's no_unchecked_cast check.
  UnsafeCast:
    active: true

style:
  active: true
  # Functions that throw on a programmer error.
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.error'
        reason: 'Throws on a programmer error; return a typed result or null instead.'
      - value: 'kotlin.require'
        reason: 'Throws on a programmer error; return a typed result or null instead.'
      - value: 'kotlin.requireNotNull'
        reason: 'Throws on a programmer error; handle null with `?.` or `?:` instead.'
      - value: 'kotlin.check'
        reason: 'Throws on a programmer error; return a typed result or null instead.'
      - value: 'kotlin.checkNotNull'
        reason: 'Throws on a programmer error; handle null with `?.` or `?:` instead.'
      - value: 'kotlin.TODO'
        reason: 'Throws when reached; finish the code instead.'
