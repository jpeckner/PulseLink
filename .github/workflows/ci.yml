name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the local SDK (`flutter --version`).
  FLUTTER_VERSION: 3.50.0

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    # Room for Gradle's first detekt run, which downloads its dependencies.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd tool/pulselink_lints && dart pub get)

      - name: Check iOS uses Swift Package Manager only (no CocoaPods)
        run: |
          if [ -e ios/Podfile ]; then
            echo "::error::ios/Podfile found. This project uses Swift Package Manager only."
            exit 1
          fi

      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          tool/pigeon.sh
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated code is out of date. Run 'dart run build_runner build' and 'tool/pigeon.sh', and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # Lints come from very_good_analysis via analysis_options.yaml. Both
      # flags are already the defaults; they're spelled out so a lint of any
      # level fails the build on purpose, not by accident of a default.
      - name: Analyze (very_good_analysis and pulselink_lints)
        run: flutter analyze --fatal-infos --fatal-warnings

      # A plugin that fails to load makes the analyze step above pass without
      # running its rules, so prove each enabled rule still reports.
      - name: Check the lint plugin is running
        run: tool/check_lint_plugin.sh

      - name: Test
        run: flutter test --coverage

      # Gradle needs a JDK to run detekt; the Android Gradle Plugin needs 17
      # or newer, and detekt 2.0 is tested on 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # tool/lint_native.sh downloads SwiftLint on first use into this cache,
      # keyed on the script, which pins the version and its SHA-256.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pulselink
          key: native-linters-${{ runner.os }}-${{ hashFiles('tool/lint_native.sh') }}

      # SwiftLint and detekt, for CLAUDE.md's native-code rules. The script
      # fails on any finding, and if either linter checked no files.
      - name: Lint native code (SwiftLint and detekt)
        run: tool/lint_native.sh

      # A linter that silently does nothing (a skipped download, a config
      # whose paths match nothing, a rule switched off) makes the step above
      # pass, so prove every rule still reports and fails the lint.
      - name: Check the native linters are running
        run: tool/check_native_lints.sh

      # The project's own lint rules (enabled for the app in
      # analysis_options.yaml, so the analyze step above runs them).
      - name: Check the lint plugin (format, analyze, test)
        working-directory: tool/pulselink_lints
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos --fatal-warnings
          dart test

  # Android (Ubuntu) and iOS (macOS, no code signing) build jobs are added in
  # Milestone 6.
