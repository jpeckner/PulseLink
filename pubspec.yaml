name: pulselink
description: "BLE heart-rate monitor with Apple Watch companion. For learning and fitness use only. Not a medical device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  bloc: ^9.2.1
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  meta: ^1.19.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  mocktail: ^1.0.5
  pigeon: ^30.0.2
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  config:
    # iOS native dependencies come from Swift Package Manager only; this
    # project never uses CocoaPods (CI fails if an ios/Podfile appears).
    enable-swift-package-manager: true
