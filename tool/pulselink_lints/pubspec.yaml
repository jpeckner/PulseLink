name: pulselink_lints
description: PulseLink's own analyzer plugin. Lint rules no built-in lint covers.
publish_to: 'none'

environment:
  sdk: ^3.14.0

# analysis_server_plugin and analyzer_testing each pin one exact analyzer
# version, so these move together. Upgrade them as a set.
dependencies:
  analysis_server_plugin: 0.3.26
  analyzer: 14.7.0

dev_dependencies:
  analyzer_testing: 0.4.5
  test: ^1.26.0
  test_reflective_loader: ^0.2.0
  very_good_analysis: ^11.0.0
