# Pinned to a specific rule set so lint changes are a deliberate upgrade,
# not a surprise when the package updates.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  errors:
    # very_good_analysis ignores close_sinks for its false positives. It's on
    # here (see below): an unclosed StreamController leaks, and BLE streams
    # arrive in Milestone 3.
    close_sinks: info
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Pigeon platform-channel code; its contracts in pigeons/ are analyzed.
    - "**/*.pigeon.dart"
    # Its own package, with its own analysis options; CI checks it separately.
    - tool/pulselink_lints/**

linter:
  rules:
    # Doc comments on every public member is overkill for an app (it's meant
    # for published packages). We still document anything non-obvious.
    public_member_api_docs: false
    # Every if, else, for, while and do body goes on its own line. With
    # curly_braces_in_flow_control_structures (from very_good_analysis), that
    # means braces always, even for `if (x) return;`, so a line added later
    # can't look like it's inside an if when it isn't.
    always_put_control_body_on_new_line: true

    # Closer to Swift's compile-time safety. See CLAUDE.md, "No assertions".
    # Dart generics are covariant: a List<int> passed as a List<num> throws
    # at runtime when a double is added. Flags class designs that allow it.
    unsafe_variance: true
    # A StreamController or other sink that's never closed leaks.
    close_sinks: true
    # Code nothing reachable from main() uses.
    unreachable_from_main: true
    avoid_implementing_value_types: true
    prefer_void_to_null: true
    # Off: it suggests making private fields `late`, which the no-assertions
    # rule forbids.
    use_late_for_private_fields_and_variables: false

# PulseLink's own lint rules (tool/pulselink_lints), for checks no built-in
# lint covers. Restart the Dart analysis server after changing this section.
plugins:
  pulselink_lints:
    path: tool/pulselink_lints
    diagnostics:
      # Pigeon's generated types have public, mutable fields, so only the
      # folder holding them uses them, converting them into domain types.
      keep_pigeon_imports_local: true
      no_assertions: true
      no_catch_all_cases: true
      # Every written `dynamic`, not just on parameters as the built-in
      # avoid_annotating_with_dynamic does.
      no_dynamic: true
      no_ignored_results: true
      use_switch_on_closed_types: true
