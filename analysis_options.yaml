# Pinned to a specific rule set so lint changes are a deliberate upgrade,
# not a surprise when the package updates.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Its own package, with its own analysis options; CI checks it separately.
    - tool/pulselink_lints/**

linter:
  rules:
    # Doc comments on every public member is overkill for an app (it's meant
    # for published packages). We still document anything non-obvious.
    public_member_api_docs: false
    # Every if, else, for, while and do body goes on its own line. With
    # curly_braces_in_flow_control_structures (from very_good_analysis), that
    # means braces always, even for `if (x) return;`, so a line added later
    # can't look like it's inside an if when it isn't.
    always_put_control_body_on_new_line: true

# PulseLink's own lint rules (tool/pulselink_lints), for checks no built-in
# lint covers. Restart the Dart analysis server after changing this section.
plugins:
  pulselink_lints:
    path: tool/pulselink_lints
    diagnostics:
      no_catch_all_cases: true
      use_switch_on_closed_types: true
